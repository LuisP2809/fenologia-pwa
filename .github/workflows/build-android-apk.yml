name: Construir APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/version-inicial-pwa
      - 'fix/**'
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.webmanifest'
      - 'data/**'
      - 'icons/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.webmanifest'
      - 'data/**'
      - 'icons/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    name: APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar validaciones completas
        run: npm test

      - name: Preparar aplicación web
        run: npm run build:web

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Generar iconos y pantalla inicial
        run: >-
          npx @capacitor/assets generate --android --assetPath assets
          --iconBackgroundColor '#07552F'
          --iconBackgroundColorDark '#043D25'
          --splashBackgroundColor '#F3F7F2'
          --splashBackgroundColorDark '#043D25'

      - name: Sincronizar Capacitor y complementos
        run: npx cap sync android

      - name: Construir APK
        run: |
          chmod +x android/gradlew
          npm run apk:debug

      - name: Leer versión del paquete
        id: package
        run: |
          node -e "process.stdout.write('version=' + require('./package.json').version + '\n')" >> "$GITHUB_OUTPUT"

      - name: Preparar archivo descargable
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Fenologia-${{ steps.package.outputs.version }}-debug.apk"
          sha256sum "dist/Fenologia-${{ steps.package.outputs.version }}-debug.apk" > "dist/Fenologia-${{ steps.package.outputs.version }}-debug.sha256"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Fenologia-APK-${{ steps.package.outputs.version }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error
