name: Construir Android Release Firmado

on:
  workflow_dispatch:
  push:
    branches:
      - agent/version-inicial-pwa
    paths:
      - android-release-trigger.txt

permissions:
  contents: read

jobs:
  release:
    name: APK y AAB firmados
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
      KEY_ALIAS: fenologia_release

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar secretos de firma
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Falta ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Falta ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$EXPECTED_CERT_SHA256" || { echo "Falta ANDROID_CERT_SHA256"; exit 1; }

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Validar PWA
        run: npm run verify:pwa

      - name: Preparar aplicación web
        run: npm run build:web

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Generar iconos y pantalla inicial
        run: >-
          npx @capacitor/assets generate --android --assetPath assets
          --iconBackgroundColor '#07552F'
          --iconBackgroundColorDark '#043D25'
          --splashBackgroundColor '#F3F7F2'
          --splashBackgroundColorDark '#043D25'

      - name: Sincronizar Capacitor y complementos
        run: npx cap sync android

      - name: Aplicar versión Android
        run: node scripts/configure-android-version.mjs

      - name: Recuperar clave privada temporalmente
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fenologia-release.jks"
          chmod 600 "$RUNNER_TEMP/fenologia-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/fenologia-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Construir APK y AAB sin firmar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Firmar y verificar artefactos
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(node -p "require('./android-release.json').versionName")"
          VERSION_CODE="$(node -p "require('./android-release.json').versionCode")"
          APP_ID="$(node -p "require('./android-release.json').applicationId")"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          UNSIGNED_AAB="android/app/build/outputs/bundle/release/app-release.aab"
          OUTPUT_DIR="dist"
          ALIGNED_APK="$RUNNER_TEMP/Fenologia-${VERSION_NAME}-release-aligned.apk"
          SIGNED_APK="$OUTPUT_DIR/Fenologia-${VERSION_NAME}-release.apk"
          SIGNED_AAB="$OUTPUT_DIR/Fenologia-${VERSION_NAME}-release.aab"
          KEYSTORE="$RUNNER_TEMP/fenologia-release.jks"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          test -f "$UNSIGNED_APK"
          test -f "$UNSIGNED_AAB"
          mkdir -p "$OUTPUT_DIR"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          cp "$UNSIGNED_AAB" "$SIGNED_AAB"
          jarsigner \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$SIGNED_AAB" "$KEY_ALIAS"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          jarsigner -verify -verbose -certs "$SIGNED_AAB" >/dev/null

          ACTUAL_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$SIGNED_APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr '[:lower:]' '[:upper:]' \
            | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" \
            | tr '[:lower:]' '[:upper:]' \
            | tr -d ':[:space:]')"

          test -n "$ACTUAL_CERT_SHA256"
          if [[ "$ACTUAL_CERT_SHA256" != "$EXPECTED" ]]; then
            echo "La firma no coincide con la clave oficial esperada." >&2
            exit 1
          fi

          sha256sum "$SIGNED_APK" "$SIGNED_AAB" > "$OUTPUT_DIR/SHA256SUMS.txt"
          cat > "$OUTPUT_DIR/INFORMACION_DE_FIRMA.txt" <<INFO
          Aplicación: $APP_ID
          Versión: $VERSION_NAME
          versionCode: $VERSION_CODE
          Alias: $KEY_ALIAS
          Certificado SHA-256: $ACTUAL_CERT_SHA256
          INFO

      - name: Publicar APK y AAB release
        uses: actions/upload-artifact@v4
        with:
          name: Fenologia-Android-Release
          path: dist/*
          retention-days: 90
          if-no-files-found: error
