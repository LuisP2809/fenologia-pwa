name: Normalizar mapa GeoJSON

on:
  push:
    branches:
      - agent/version-inicial-pwa
    paths:
      - data/lotes-mapa.geojson
      - .github/workflows/normalizar-mapa.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: agent/version-inicial-pwa
          fetch-depth: 0

      - name: Descomprimir y validar GeoJSON
        id: mapa
        shell: python
        run: |
          import base64
          import gzip
          import json
          import os
          from pathlib import Path

          path = Path('data/lotes-mapa.geojson')
          output = Path(os.environ['GITHUB_OUTPUT'])
          payload = json.loads(path.read_text(encoding='utf-8'))

          if payload.get('encoding') != 'gzip-base64':
              print('El archivo ya es GeoJSON normal.')
              with output.open('a', encoding='utf-8') as out:
                  out.write('changed=false\n')
              raise SystemExit(0)

          encoded = ''.join(str(payload.get('data', '')).split())
          encoded = encoded.replace('-', '+').replace('_', '/')
          encoded += '=' * ((4 - len(encoded) % 4) % 4)

          compressed = base64.b64decode(encoded)
          raw = gzip.decompress(compressed)
          geojson = json.loads(raw.decode('utf-8'))

          if geojson.get('type') != 'FeatureCollection':
              raise ValueError('El archivo no es una FeatureCollection.')

          features = geojson.get('features')
          if not isinstance(features, list) or len(features) != 254:
              raise ValueError(f'Se esperaban 254 geometrías normalizadas y se encontraron {len(features) if isinstance(features, list) else 0}.')

          activos = sum(1 for feature in features if feature.get('properties', {}).get('ACTIVO'))
          if activos != 253:
              raise ValueError(f'Se esperaban 253 lotes activos y se encontraron {activos}.')

          path.write_text(
              json.dumps(geojson, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )

          with output.open('a', encoding='utf-8') as out:
              out.write('changed=true\n')

          print(f'GeoJSON validado: {len(features)} geometrías, {activos} lotes activos.')

      - name: Guardar GeoJSON normal
        if: steps.mapa.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotes-mapa.geojson
          git commit -m "Reemplazar mapa comprimido por GeoJSON normal"
          git push origin HEAD:agent/version-inicial-pwa
